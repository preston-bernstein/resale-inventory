version: 2
updates:
  # This repo pins its actions to commit SHAs. Without this, pinning would mean
  # going stale: Dependabot rewrites the pin to the new commit and updates the
  # trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release. A compromised or broken
    # action release is usually caught and yanked inside that window.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The gate tools are pinned with hashes. Dependabot proposes new versions as
  # reviewed PRs; regenerate requirements.txt with `uv pip compile --generate-hashes`.
  - package-ecosystem: pip
    directory: /.github/gate-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    # lizard 1.25.1 measures TSX functions differently from 1.25.0 (nine over-limit functions become thirteen; Dashboard
    # goes from 88 to 108 lines), so .core-baseline.json no longer matches. Baselines may only shrink, so hold lizard here
    # until the baseline is rewritten on purpose.
    ignore:
      - dependency-name: "lizard"
  - package-ecosystem: npm
    directory: /.github/gate-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
